name: Daily Finance Video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  schedule:
    # 06:30 Asia/Taipei = 22:30 UTC (previous day)
    - cron: '30 22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verify HsiaoChen voice
        run: |
          edge-tts --list-voices | grep 'zh-TW-HsiaoChenNeural'

      - name: Run daily pipeline
        env:
          TIMEZONE: Asia/Taipei
          FINVIZ_URL: https://finviz.com/map?t=sec_ndx
          OUTPUT_DIR: output
        run: python -m src.main

      - name: Upload daily package
        uses: actions/upload-artifact@v4
        with:
          name: daily-finance-${{ github.run_id }}
          path: output/
          retention-days: 14
